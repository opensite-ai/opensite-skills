# ~/.tmux.conf — senior defaults for remote-first, scriptable tmux.
# Install tpm first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then reload and press: prefix + I  (capital i) to install plugins.

# --- Core behavior -----------------------------------------------------------
# Remap prefix to Ctrl-a (closer to home row; frees Ctrl-b).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on                      # mouse resize/select/scroll
set -g base-index 1                  # windows start at 1
setw -g pane-base-index 1            # panes start at 1
set -g renumber-windows on           # keep window numbers gapless
set -g history-limit 100000          # deep scrollback for logs/rg output
set -g escape-time 10                # snappier ESC in Neovim
set -g focus-events on               # let editors know when tmux gains focus
set -sa terminal-features ',*:RGB'   # truecolor
set -g set-clipboard on              # sync copy to system clipboard (OSC 52)

# --- Reload ------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Splits keep the current path --------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Vi-style pane navigation + copy mode ------------------------------------
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Sessionizer: fuzzy-jump to a project as a named session -----------------
# Requires fzf + fd. Bind to prefix + f.
bind f run-shell "tmux neww ~/.tmux/sessionizer.sh"

# --- Plugins (tpm) -----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # periodic auto-save
set -g @continuum-restore 'on'

# Keep this line at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
